name: Dependency Review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch for dependency diff (for manual dispatch)"
        required: true
        type: string
      head_ref:
        description: "Head branch/ref for dependency diff (for manual dispatch)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Dependency review (pull_request)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0, LGPL-3.0, SSPL-1.0
          # Next.js 16.3.0 installs these reviewed prebuilt libvips packages via Sharp.
          # Pin the exceptions so later libvips releases still require license review.
          allow-dependencies-licenses: >-
            pkg:npm/@img/sharp-libvips-darwin-arm64@1.3.2,
            pkg:npm/@img/sharp-libvips-darwin-x64@1.3.2,
            pkg:npm/@img/sharp-libvips-linux-arm@1.3.2,
            pkg:npm/@img/sharp-libvips-linux-arm64@1.3.2,
            pkg:npm/@img/sharp-libvips-linux-ppc64@1.3.2,
            pkg:npm/@img/sharp-libvips-linux-riscv64@1.3.2,
            pkg:npm/@img/sharp-libvips-linux-s390x@1.3.2,
            pkg:npm/@img/sharp-libvips-linux-x64@1.3.2,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64@1.3.2,
            pkg:npm/@img/sharp-libvips-linuxmusl-x64@1.3.2
      - name: Dependency review (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0, LGPL-3.0, SSPL-1.0
          # Keep manual dependency reviews aligned with pull-request reviews.
          allow-dependencies-licenses: >-
            pkg:npm/@img/sharp-libvips-darwin-arm64@1.3.2,
            pkg:npm/@img/sharp-libvips-darwin-x64@1.3.2,
            pkg:npm/@img/sharp-libvips-linux-arm@1.3.2,
            pkg:npm/@img/sharp-libvips-linux-arm64@1.3.2,
            pkg:npm/@img/sharp-libvips-linux-ppc64@1.3.2,
            pkg:npm/@img/sharp-libvips-linux-riscv64@1.3.2,
            pkg:npm/@img/sharp-libvips-linux-s390x@1.3.2,
            pkg:npm/@img/sharp-libvips-linux-x64@1.3.2,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64@1.3.2,
            pkg:npm/@img/sharp-libvips-linuxmusl-x64@1.3.2
          base-ref: ${{ inputs.base_ref }}
          head-ref: ${{ inputs.head_ref }}
