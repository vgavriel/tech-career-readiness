name: Dependabot Lockfile Autofix

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - package.json
      - package-lock.json

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dependabot branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit and push lockfile update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock.json changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package-lock.json"
          git push

          # GITHUB_TOKEN pushes don't trigger pull_request workflows, so
          # explicitly dispatch the full validation suite on the updated head ref.
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -X POST \
            -f ref="${PR_HEAD_REF}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/e2e.yml/dispatches" \
            -X POST \
            -f ref="${PR_HEAD_REF}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/a11y.yml/dispatches" \
            -X POST \
            -f ref="${PR_HEAD_REF}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/dispatches" \
            -X POST \
            -f ref="${PR_HEAD_REF}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/dependency-review.yml/dispatches" \
            -X POST \
            -f ref="${PR_HEAD_REF}" \
            -f "inputs[base_ref]=${PR_BASE_REF}" \
            -f "inputs[head_ref]=${PR_HEAD_REF}"
